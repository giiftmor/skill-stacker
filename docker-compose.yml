# skill-stacker/docker-compose.yml
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: skill-stacker-db
    environment:
      - POSTGRES_DB=${DB_NAME:-cvbuilder}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Next.js App
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${HOST_PORT:-5252}:5252"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=cvbuilder
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - LLM_PROVIDER=${LLM_PROVIDER:-local}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:1234}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
    volumes:
      - ./scripts:/app/scripts:ro
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5252/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:

networks:
  default:
    name: skill-stacker-network
