<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc"/>
      <stop offset="100%" style="stop-color:#c4b5fd"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- Stack layer 1 (bottom) -->
  <rect x="7" y="10" width="18" height="14" rx="1.5" fill="url(#stack)" opacity="0.5"/>
  <!-- Stack layer 2 (middle) -->
  <rect x="8" y="8" width="18" height="14" rx="1.5" fill="url(#stack)" opacity="0.7"/>
  <!-- Main CV card -->
  <rect x="9" y="6" width="18" height="14" rx="1.5" fill="white"/>
  <!-- CV fold corner -->
  <path d="M21 6 L27 6 L27 12 Z" fill="#e0e7ff"/>
  <path d="M21 6 L27 12 L21 12 Z" fill="#c7d2fe"/>
  <!-- Text lines (skills) -->
  <rect x="11" y="9" width="8" height="1.5" rx="0.75" fill="#6366f1"/>
  <rect x="11" y="12" width="6" height="1.2" rx="0.6" fill="#a5b4fc"/>
  <rect x="11" y="14.5" width="7" height="1.2" rx="0.6" fill="#a5b4fc"/>
  <!-- Stack dots -->
  <circle cx="13" cy="20" r="1" fill="white" opacity="0.8"/>
  <circle cx="16" cy="20" r="1" fill="white" opacity="0.6"/>
  <circle cx="19" cy="20" r="1" fill="white" opacity="0.4"/>
</svg>